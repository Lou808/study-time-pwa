<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a5f" />
    <!-- iPhone でホーム画面から開いたときの設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="勉強時間" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>勉強時間計算</title>
  </head>
  <body>
    <main class="app">
      <h1>勉強時間計算</h1>

      <section class="card">
        <h2>今日の余暇時間</h2>
        <div class="time-inputs">
          <div class="stepper">
            <button type="button" class="step" data-target="hours" data-delta="-1" aria-label="1時間減らす">−</button>
            <label>
              <input id="hours" type="number" inputmode="numeric" min="0" max="24" value="0" />
              <span>時間</span>
            </label>
            <button type="button" class="step" data-target="hours" data-delta="1" aria-label="1時間増やす">＋</button>
          </div>
          <div class="stepper">
            <button type="button" class="step" data-target="minutes" data-delta="-5" aria-label="5分減らす">−</button>
            <label>
              <input id="minutes" type="number" inputmode="numeric" min="0" max="59" value="0" />
              <span>分</span>
            </label>
            <button type="button" class="step" data-target="minutes" data-delta="5" aria-label="5分増やす">＋</button>
          </div>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <section class="card result" aria-live="polite">
        <div class="row">
          <span class="label">法学</span>
          <span id="law-result" class="value">0時間0分</span>
        </div>
        <div class="row">
          <span class="label">仕事の勉強</span>
          <span id="work-result" class="value">0時間0分</span>
        </div>
        <p id="ratio-note" class="note"></p>
      </section>

      <details class="card settings">
        <summary>比率の設定</summary>
        <div class="ratio-inputs">
          <label>
            <span>法学</span>
            <input id="ratio-law" type="number" inputmode="numeric" min="0" max="100" />
          </label>
          <span class="colon">:</span>
          <label>
            <span>仕事の勉強</span>
            <input id="ratio-work" type="number" inputmode="numeric" min="0" max="100" />
          </label>
        </div>
        <button id="ratio-reset" type="button" class="secondary">初期値（8 : 2）に戻す</button>
      </details>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
